<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endomarketing Hub</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=5">
  <link rel="stylesheet" href="{{ url_for('static', filename='certificado_drag.css') }}?v=1">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <span class="app-header__brand">
        <img src="{{ url_for('static', filename='logo_branca.png') }}" alt="Logo" class="header-logo" onerror="this.style.display='none'">
        <span class="header-title">Endomarketing Hub</span>
      </span>
    </div>
  </header>

  <main class="layout">
    <!-- COL 1: Menu Lateral -->
    <nav class="panel panel--nav sidebar-nav">
      <button class="nav-btn active" data-target="agenda">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Agenda de Integração
      </button>
      <button class="nav-btn" data-target="cardapio">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M9 21V9"/></svg>
        Cardápio Semanal
      </button>
      <button class="nav-btn" data-target="ikanews">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM12 11h.01M8 11h.01M16 11h.01M12 15h.01"/></svg>
        Ikanews
      </button>
      <button class="nav-btn" data-target="certificado">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>
        Certificado Alura Ikatec
      </button>
    </nav>

    <!-- COL 2: Painel de Formulários -->
    <aside class="panel panel--form" id="forms-container">
      
      <!-- AGENDA FORM -->
      <div id="form-agenda" class="tool-form active">
        <div class="panel__title">Dados do Colaborador (Agenda)</div>
        <div class="field">
          <label for="collabName">Nome completo</label>
          <input type="text" id="collabName" placeholder="Ex.: Maria Oliveira" autocomplete="off" />
        </div>
        <div class="field">
          <label for="integrationDate">Data da integração</label>
          <input type="date" id="integrationDate" />
        </div>
        <div class="divider"></div>
        <div class="panel__title">Atividades</div>
        <div id="activitiesContainer"></div>
        <button id="addActivityBtn" class="btn btn--ghost btn--full">
          Adicionar atividade
        </button>
        <div class="divider"></div>
        
      </div>

            <!-- CARDAPIO FORM -->
      <form id="form-cardapio" class="tool-form" action="/api/cardapio-json" method="post">
        <div class="panel__title">Upload do Cardápio</div>
        <div class="field">
          <label>Planilha Excel (.xlsx)</label>
          <input type="file" id="cardapio-file" accept=".xlsx" />
        </div>
        
        <div id="cardapio-editor" style="display:none; margin-top: 1rem; display: flex; flex-direction: column; gap: 1rem;">
          <div class="divider"></div>
          <div class="panel__title">Editar Dados do Cardápio</div>
          <div class="field">
            <label>Período (Ex: 12/12 a 16/12)</label>
            <input type="text" id="cardapio-periodo" required />
          </div>
          
          <div id="cardapio-dias-container"></div>
        </div>

        
      </form>

      <!-- IKANEWS FORM -->
      <form id="form-ikanews" class="tool-form" action="/api/ikanews" method="post" enctype="multipart/form-data">
        <div class="panel__title">Dados Ikanews</div>
        <div class="field">
          <label>Quantidade de Colaboradores</label>
          <select id="ika-qtd" name="quantidade">
            <option value="1">1 Colaborador</option>
            <option value="2">2 Colaboradores</option>
            <option value="3">3 Colaboradores</option>
            <option value="4">4 Colaboradores</option>
          </select>
        </div>
        <div id="colaboradores-container"></div>
        
      </form>

      <!-- CERTIFICADO FORM -->
      <form id="form-certificado" class="tool-form" action="/api/certificado" method="post">
        <div class="panel__title">Dados do Certificado</div>
        
        <div class="field" style="margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--c-border);">
          <label>Modelo do Certificado</label>
          <select id="cert-modelo" name="modelo" class="form__input" style="width: 100%; margin-bottom: 0.5rem; padding: 0.5rem; border: 1px solid var(--c-border); border-radius: 4px; background: var(--c-bg); color: var(--c-fg);">
            <option value="alura">Alura</option>
            <option value="ikated">IKATED</option>
            <option value="generico">Evento</option>
          </select>

          <label>Modo de Geração</label>
          <div style="display: flex; gap: 1rem; align-items: center; margin-top: 0.5rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
              <input type="radio" name="cert_mode" value="unico" checked>
              Único
            </label>
            <label id="lbl-mode-lote" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--c-fg-muted);">
              <input type="radio" name="cert_mode" value="lote" id="radio-mode-lote" disabled>
              Em Lote
            </label>
          </div>
        </div>

        <div class="field" id="group-nome">
          <label id="label-nome">Nome Completo</label>
          <input type="text" name="nome" id="input-nome-unico" placeholder="Ex: Gi do RH" />
          <textarea name="nomes_lote" id="input-nome-lote" placeholder="Cole a lista de nomes aqui (um por linha)..." rows="5" style="display: none; width: 100%; resize: vertical; padding: 0.5rem; border: 1px solid var(--c-border); border-radius: 4px; background: var(--c-bg); color: var(--c-fg);"></textarea>
        </div>

        <!-- ALURA FIELDS -->
        <div class="field" id="group-curso">
          <label>Curso/Treinamento</label>
          <input type="text" name="curso" />
        </div>
        <div class="form-row" id="row-alura">
          <div class="field">
            <label>Carga Horária</label>
            <input type="text" name="carga" />
          </div>
          <div class="field">
            <label>Data</label>
            <input type="text" name="data" />
          </div>
        </div>

        <!-- IKATED FIELDS -->
        <div class="field" id="group-tema" style="display: none;">
          <label>Texto do Tema</label>
          <input type="text" name="tema" placeholder="Certificamos que participou do IKATED: Integração de IA em Sistemas" />
        </div>
        <div class="field" id="group-apresentador" style="display: none;">
          <label>Texto do Apresentador e Carga</label>
          <input type="text" name="apresentador" placeholder="Ministrado por Deyvisson Tavares Carga horária: 1 horas" />
        </div>
        
        <!-- GENERIC FIELDS -->
        <div id="dynamic-fields-container"></div>
        <button type="button" id="btn-add-field" class="btn btn--outline" style="display: none; width: 100%; margin-top: 1rem;">+ Adicionar Campo Extra</button>

        <!-- HIDDEN CONFIG FOR BATCH GENERATION -->
        <input type="hidden" name="current_config" id="hidden-config" value="{}">
      </form>

    </aside>

    <!-- COL 3: Painel de Pré-visualização -->
    <section class="panel panel--preview" id="previews-container" style="position: relative;">
      
      <div id="cert-props-panel" style="display: none; position: absolute; top: 70px; right: 20px; background: var(--c-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--c-border); box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 1000; width: 220px;">
        <div style="font-size: 13px; font-weight: bold; margin-bottom: 12px; color: var(--c-fg);">Propriedades do Texto</div>
        
        <div style="margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
          <label style="font-size: 12px; color: var(--c-fg-muted);">Cor do Texto:</label>
          <input type="color" id="prop-color" value="#ffffff" style="width: 32px; height: 32px; border: none; cursor: pointer; padding: 0; border-radius: 8px; overflow: hidden; background: transparent;">
        </div>
        
        <div style="margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;">
          <label style="font-size: 12px; color: var(--c-fg-muted);">Tamanho (px):</label>
          <input type="number" id="prop-size" value="50" style="width: 60px; padding: 4px; border: 1px solid var(--c-border); border-radius: 4px; background: var(--c-bg); color: var(--c-fg);">
        </div>
        
        <div style="border-top: 1px solid var(--c-border); margin: 10px -15px; padding: 10px 15px 0 15px;">
          <label style="font-size: 12px; color: var(--c-fg); display: flex; align-items: center; gap: 6px; cursor: pointer; margin-bottom: 10px;">
            <input type="checkbox" id="prop-show-label">
            Mostrar Título Fixo acima
          </label>
          
          <div id="prop-label-color-group" style="display: none; align-items: center; justify-content: space-between;">
            <label style="font-size: 12px; color: var(--c-fg-muted);">Cor do Título:</label>
            <input type="color" id="prop-label-color" value="#08cfff" style="width: 32px; height: 32px; border: none; cursor: pointer; padding: 0; border-radius: 8px; overflow: hidden; background: transparent;">
          </div>
        </div>
      </div>
      
      <!-- AGENDA PREVIEW -->
      <div id="preview-agenda" class="tool-preview active">
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
          <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <div class="panel__title panel__title--preview" style="margin-bottom: 0;">Pré-visualização da Agenda</div>
          <div style="display: flex; gap: 0.5rem;">
            <button type="button" id="exportPdfBtn" class="btn btn--outline">Exportar PDF</button>
            <button type="button" id="exportPngBtn" class="btn btn--primary">Exportar PNG</button>
          </div>
        </div>
          <div class="a4-wrapper">
            <div id="agendaDoc" class="agenda-doc"></div>
          </div>
        </div>
      </div>

      <!-- OTHER PREVIEWS -->
      <div id="preview-cardapio" class="tool-preview">
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
          <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <div class="panel__title panel__title--preview" style="margin-bottom: 0;">Pré-visualização do Cardápio</div>
          <button type="button" id="export-cardapio" class="btn btn--primary" disabled>Exportar PNG</button>
        </div>
          <div class="generated-preview-wrapper" id="render-cardapio" style="display:none;"></div>
        </div>
      </div>

      <div id="preview-ikanews" class="tool-preview">
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
          <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <div class="panel__title panel__title--preview" style="margin-bottom: 0;">Pré-visualização Ikanews</div>
          <button type="button" id="export-ikanews" class="btn btn--primary" disabled>Exportar PNG</button>
        </div>
          <div class="generated-preview-wrapper" id="render-ikanews" style="display:none;"></div>
        </div>
      </div>

      <div id="preview-certificado" class="tool-preview">
        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
          <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <div class="panel__title panel__title--preview" style="margin-bottom: 0;">Pré-visualização Certificado</div>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: flex-end; align-items: center;">
              <input type="file" id="upload-bg-certificado" accept="image/png, image/jpeg" style="display: none;">
              <button type="button" id="btn-upload-bg" class="btn" style="display: none; background: transparent; border: 1px solid var(--c-primary); color: var(--c-primary);">Trocar Fundo</button>
              <button type="button" id="save-default-certificado" class="btn" style="display: none; background: transparent; border: 1px solid var(--c-primary); color: var(--c-primary);">Salvar como Padrão</button>
              <button type="button" id="reset-certificado" class="btn" style="display: none; background: transparent; border: 1px solid var(--c-border); color: var(--c-fg);">Redefinir posições</button>
              <button type="button" id="btn-toggle-edit" class="btn" style="background: transparent; border: 1px solid var(--c-fg); color: var(--c-fg);">Modo Edição</button>
              <button type="button" id="export-certificado" class="btn btn--primary" disabled>Exportar PNG</button>
          </div>
        </div>
          <div class="generated-preview-wrapper" id="render-certificado" style="display:none;"></div>
        </div>
      </div>

    </section>
  </main>

  <!-- Add Custom Field Modal -->
  <div id="modal-add-field" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
    <div style="background: var(--c-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--c-border); width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
      <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 16px; color: var(--c-fg);">Novo Campo Extra</h3>
      <label style="font-size: 13px; color: var(--c-fg-muted); display: block; margin-bottom: 5px;">Nome do campo (ex: Local, Assinatura)</label>
      <input type="text" id="modal-field-name" style="width: 100%; margin-bottom: 15px; padding: 8px; border: 1px solid var(--c-border); border-radius: 4px; background: var(--c-bg); color: var(--c-fg);" autocomplete="off">
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" id="modal-btn-cancel" class="btn" style="background: transparent; color: var(--c-fg); border: 1px solid var(--c-border);">Cancelar</button>
        <button type="button" id="modal-btn-confirm" class="btn btn--primary">Adicionar</button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}?v=11"></script>
  <script src="{{ url_for('static', filename='certificado_drag.js') }}?v=1"></script>
</body>
</html>
